<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JUD 2K26 · Tabela de Jogos</title>
  <meta name="description" content="Tabela de jogos e resultados do JUD 2K26.">
  <meta name="theme-color" content="#007eff">
  <meta property="og:title" content="JUD 2K26 · Tabela de Jogos">
  <meta property="og:description" content="Jogos e resultados em tempo real.">
  <link rel="icon" href="assets/logo-jud.png">
  <link rel="preload" href="assets/fonts/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="promo promo-side" id="promo-side" aria-label="Festa do evento" hidden>
    <a class="promo-img" href="#" target="_blank" rel="noopener"><img src="assets/banner-festa-lateral.webp" width="480" height="960" alt="Vacatio Legis · 01 de novembro · Alto do Andu"></a>
    <a class="promo-btn" href="#" target="_blank" rel="noopener">Garanta seu ingresso!!</a>
  </aside>

  <div class="side-legend" aria-hidden="true">
    <span><i class="dot dot-f"></i>Modalidade feminina</span>
    <span><i class="dot dot-m"></i>Modalidade masculina</span>
  </div>

  <header class="top">
    <img class="logo" src="assets/logo-jud.png" alt="JUD 2K26">
    <div class="top-title">
      <h1>Tabela de jogos</h1>
      <p id="updated" class="updated"></p>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filtros">
      <div class="days" id="days"></div>
      <div class="chips" id="f-equipe" aria-label="Atlética"></div>
      <div class="row-filters">
        <div class="seg" id="f-naipe"></div>
        <div class="chips small" id="f-mod"></div>
      </div>
      <div class="chips small" id="f-local"></div>
    </section>

    <aside class="promo promo-inline" id="promo-inline" aria-label="Festa do evento" hidden>
      <a class="promo-img" href="#" target="_blank" rel="noopener"><img src="assets/banner-festa-horizontal.webp" width="1080" height="540" alt="Vacatio Legis · 01 de novembro · Alto do Andu"></a>
      <a class="promo-btn" href="#" target="_blank" rel="noopener">Garanta seu ingresso!!</a>
    </aside>

    <section id="view-jogos" class="view"></section>

    <p class="aviso" id="aviso"></p>

    <button class="share" id="share" type="button">Compartilhar</button>
  </main>

  <footer class="foot">
    <div class="legend-inline">
      <span><i class="dot dot-f"></i>Feminino</span>
      <span><i class="dot dot-m"></i>Masculino</span>
    </div>
    <img class="apoio" src="assets/apoiadores.png" alt="Realização e apoiadores">
  </footer>

  <dialog class="popup" id="popup" aria-labelledby="popup-titulo">
    <img src="assets/logo-jud.png" alt="" class="popup-logo">
    <h2 id="popup-titulo">Aviso</h2>
    <p id="popup-texto">Site em fase de teste. Tabela de acompanhamento. Em caso de divergência, prevalece a súmula oficial da organização.</p>
    <button type="button" id="popup-ok">Entendi</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
